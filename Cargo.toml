[package]
name = "cadence"
version = "0.1.1"
edition = "2021"
description = "Audio and video downloader powered by yt-dlp"
license = "MIT"

[dependencies]
gpui = "=0.2.2"
raw-window-handle = "0.6"
tray-icon = "0.25"
async-channel = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
url = "2"
unicode-segmentation = "1"
ureq = { version = "3", default-features = false, features = ["native-tls", "gzip"] }
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
